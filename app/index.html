<script>
// Owned UI text is bound by ID; provider/user text is never looked up in catalogs.
let uiLocale='pt-BR',uiCatalog={},uiReady=false;
const uiBindings=new Map();
function uiTr(key,values={}){const fields=typeof values==='function'?values():values;return (uiCatalog[key]||key).replace(/\{(\w+)\}/g,(match,name)=>Object.hasOwn(fields,name)?String(fields[name]):match)}
function uiText(node,key,values={}){uiBindings.set(node,{key,values});node.textContent=uiTr(key,values)}
function uiRaw(node,value){uiBindings.delete(node);node.textContent=value}
function uiPrune(){for(const [node] of uiBindings)if(node.isConnected===false)uiBindings.delete(node)}
function uiAttr(node,attribute,key){node.setAttribute(attribute,uiTr(key));node.dataset['orbitzAttr'+attribute.replace(/-([a-z])/g,(_,c)=>c.toUpperCase())]=key}
function uiError(key){const error=Error(uiTr(key));error.uiKey=key;return error}
function uiErrorText(node,error){if(error.uiKey)uiText(node,error.uiKey);else if(error.code==='key_required')uiText(node,'youtube.key_required');else uiRaw(node,error.message)}
window.orbitzSetLanguage=function(payload){
 uiLocale=payload.locale==='en-US'?'en-US':'pt-BR';uiCatalog=payload.catalog||{};document.documentElement.lang=uiLocale;
 for(const node of document.querySelectorAll('[data-i18n]'))uiText(node,node.dataset.i18n);
 for(const attribute of ['aria-label','placeholder','title'])for(const node of document.querySelectorAll('[data-i18n-'+attribute+']'))node.setAttribute(attribute,uiTr(node.getAttribute('data-i18n-'+attribute)));
 for(const [node,binding] of uiBindings){if(node.isConnected===false){uiBindings.delete(node);continue;}node.textContent=uiTr(binding.key,binding.values);}
 const frame=document.getElementById('youtube-player');if(frame)frame.title=uiTr('youtube.player_title');
 if(window.orbitzRunnerLanguageChanged)window.orbitzRunnerLanguageChanged();
 if(window.orbitzFeaturesLanguage)window.orbitzFeaturesLanguage();
 if(!uiReady){uiReady=true;loadRecommendations();}
};

const $=id=>document.getElementById(id);let selected='',sequence=0;window.orbitzGamesHome=true;
function ufoPhase(age){if(age<1)return'enter';if(age<2)return'hover';if(age<3)return'exit';return'done'}
function ufoEase(progress){const t=Math.max(0,Math.min(1,progress));return t*t*(3-2*t)}
function obstacleTop(obstacle,floorY){return obstacle.type==='mosquito'?floorY-obstacle.altitude-obstacle.h/2:floorY-obstacle.h}
function obstacleAimY(obstacle,floorY){return obstacleTop(obstacle,floorY)+obstacle.h/2}
function runnerHitsObstacle(obstacle,playerY,floorY){const top=obstacleTop(obstacle,floorY),bottom=obstacle.type==='mosquito'?top+obstacle.h:floorY;return obstacle.x<88&&obstacle.x+obstacle.w>45&&playerY>top+8&&playerY-73<bottom}
function nearestUfoTarget(obstacles,characterRight){return obstacles.filter(o=>['cactus','rock','mosquito'].includes(o.type)&&o.x+o.w>characterRight).reduce((nearest,o)=>!nearest||Math.max(0,o.x-characterRight)<Math.max(0,nearest.x-characterRight)?o:nearest,null)}
function validRunnerBest(score){return Number.isSafeInteger(score)&&score>=0&&score<=2147483647}
function shouldShowExternalVideoLink(selectedId,screenHidden,runnerHidden){return Boolean(selectedId)&&!screenHidden&&runnerHidden}
function isNewRunnerBest(score,best){return validRunnerBest(score)&&score>best}
function ufoReadyToSpawn(timeRemaining,activeCount){return timeRemaining<=0&&activeCount===0}
function ufoPose(ufo,age,width,height){const start=ufo.direction>0?-36:width+36,end=ufo.direction>0?width+36:-36,anchor=width*(ufo.direction>0?.62:.38),phase=ufoPhase(age),p=phase==='enter'?ufoEase(age):phase==='exit'?ufoEase(age-2):0,sway=phase==='hover'?Math.sin((age-1)*5+ufo.phase)*Math.min(8,width*.015):0;let x=phase==='enter'?start+(anchor-start)*p:phase==='exit'?anchor+(end-anchor)*p:phase==='done'?end:anchor+sway;return{x:x+Math.sin(age*9+ufo.phase)*2,y:height*.23+Math.sin(age*5+ufo.phase)*Math.max(4,height*.035),tilt:Math.sin(age*5+ufo.phase)*.045}}
(()=>{
 const canvas=$('runner-canvas'),ctx=canvas.getContext('2d'),panel=$('runner'),help=$('runner-help'),live=$('runner-live'),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const g={w:0,h:0,dpr:1,last:0,score:0,best:0,newRecord:false,speed:250,elapsed:0,difficulty:0,y:0,vy:0,obs:[],obstacleDistance:0,nextObstacleDistance:390,clusterRemaining:0,clusterAfterGroup:false,bullets:[],explosions:[],ufos:[],ufoDirection:1,ufoLasers:[],ufoSpawnTimer:3,fireTimer:0,flash:0,clouds:[],stars:[],over:false,started:false,jumpHeld:false,pressStarted:0};
 const floor=()=>g.h-34;
 function starterCacti(){const first=Math.max(150,g.w*.45);return g.w>520?[{type:'cactus',x:first,w:16,h:32},{type:'rock',x:g.w*.90,w:27,h:18}]:[{type:'cactus',x:first,w:16,h:32}]}
 function resetObstacleSchedule(){g.obstacleDistance=0;g.clusterRemaining=0;g.clusterAfterGroup=false;g.nextObstacleDistance=(340-40*g.difficulty)+Math.random()*(100-20*g.difficulty)}
 function scheduleNextObstacle(){const d=g.difficulty;if(g.clusterRemaining>0){g.nextObstacleDistance=(100-20*d)+Math.random()*(50-10*d);g.clusterRemaining--;if(!g.clusterRemaining)g.clusterAfterGroup=true;return}if(g.clusterAfterGroup){g.nextObstacleDistance=(460-80*d)+Math.random()*(180-30*d);g.clusterAfterGroup=false;return}if(Math.random()<.55){g.clusterRemaining=2+Math.floor(Math.random()*2);scheduleNextObstacle();return}g.nextObstacleDistance=(340-40*d)+Math.random()*(100-20*d)}
 function seedSky(){g.stars=Array.from({length:Math.max(24,Math.round(g.w/18))},()=>({x:Math.random()*g.w,y:Math.random()*Math.max(1,g.h-64),r:.5+Math.random()*1.1,phase:Math.random()*Math.PI*2,alpha:.35+Math.random()*.55}));g.clouds=[{x:g.w*.27,y:g.h*.24},{x:g.w*.68,y:g.h*.16},{x:g.w*.91,y:g.h*.31}];g.obs=starterCacti();resetObstacleSchedule()}
 function fireShot(){const sx=44+60,sy=g.y-17,target=g.obs.filter(o=>o.x+o.w>sx).sort((a,b)=>a.x-b.x)[0],vx=640,time=target?Math.max(.04,(target.x-sx)/(vx+g.speed)):0,vy=target?(obstacleAimY(target,floor())-sy)/time:0;g.bullets.push({x:sx,y:sy,vx,vy,life:2});g.fireTimer=0;g.flash=.09;window.orbitzGameSound?.('shot')}

function startSelectedVideo(){
 const request=++playbackRequest;

 const player=youtubePlayer;
 const resume=window.orbitzVideoStart?.(selected)||0;
 if(window.orbitzVideoPaused?.()){pendingPlayback=false;player.cueVideoById({videoId:selected,startSeconds:resume});return;}
 if(player.getVideoData?.().video_id!==selected){if(resume>0)player.loadVideoById({videoId:selected,startSeconds:resume});else player.loadVideoById(selected)}else if(resume>0)player.seekTo(resume,true);

 const check=()=>{
  if(request!==playbackRequest||!pendingPlayback)return;

  if(state===1){stopPlaybackRetry();return;}
  if(++attempts>8){stopPlaybackRetry();return;}
  if(state===-1||state===5||state===2)player.playVideo();
  playbackTimer=setTimeout(check,750);

}
function youtubeAPI(){

// Automatic controls: one cancellable deadline, tied to the current pointer epoch.

let autoControlsTimer=0,autoTimerGeneration=0,autoPointerSequence=0,autoDeadlineHidden=null;
function cancelAutoControlsTimer(){

}
function autoControlsBlocked(){return Boolean(window.orbitzFeaturesOpen?.())||Boolean(window.orbitzResumeOffered?.())||!$('config').hidden||!$('discovery').hidden||!$('settings-menu').hidden||!controlsContent()}
function autoPointerHitsContent(sample){

function reconcileAutoControls(){
 // Only fresh native pointer samples classify the pointer. Layout changes
 // during hiding/restoring must never reinterpret an older coordinate sample.

  cancelAutoControlsTimer();
  if(autoControlsEnabled)controlsRequestedHidden=false;
  return;

  if(generation!==autoTimerGeneration||!autoControlsEnabled||autoControlsBlocked()||hidden===autoPointerInside)return;
